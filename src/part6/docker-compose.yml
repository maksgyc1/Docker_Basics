version: '3.8'

services:
  fastcgi-app:
    build:
      context: ../part5
    networks:
      - app-network

  nginx:
    build:
      context: .
    ports:
      - "80:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - fastcgi-app
    networks:
      - app-network

networks:
  app-network:
    driver: bridge